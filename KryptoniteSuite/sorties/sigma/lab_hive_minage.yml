title: H.I.V.E. (minage) — traces d'agent (kit lab Maxime Leal)
status: experimental
description: >
  Detection des traces du kit H.I.V.E. (minage) (RickPortal/LexCorp/etc lab).
  Generes automatiquement par KryptoniteSuite.
logsource:
    product: windows
    service: sysmon
detection:
    process_creation:
        Image|endswith:
          - 'xmrig'
          - 'ruche_worker'

    file_event:
        TargetFilename|contains:
          - 'ruche_worker.py'
          - 'config.json (xmrig)'

    persistence:
        'com.apple.hivesync (LaunchAgent)'
    condition: 1 of them
fields:
    - Image
    - TargetFilename
falsepositives:
    - machines de lab Maxime Leal (autorise)
level: high
tags:
    - attack.execution
    - attack.persistence
