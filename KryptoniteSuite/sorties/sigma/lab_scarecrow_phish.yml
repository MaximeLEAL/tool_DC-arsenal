title: Scarecrow Phish — traces d'agent (kit lab Maxime Leal)
status: experimental
description: >
  Detection des traces du kit Scarecrow Phish (RickPortal/LexCorp/etc lab).
  Generes automatiquement par KryptoniteSuite.
logsource:
    product: windows
    service: sysmon
detection:
    file_event:
        TargetFilename|contains:
          - 'captures.json'
          - 'mirror_captures.json'

    condition: 1 of them
fields:
    - Image
    - TargetFilename
falsepositives:
    - machines de lab Maxime Leal (autorise)
level: high
tags:
    - attack.execution
    - attack.persistence
