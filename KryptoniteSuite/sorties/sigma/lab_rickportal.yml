title: RickPortal — traces d'agent (kit lab Maxime Leal)
status: experimental
description: >
  Detection des traces du kit RickPortal (RickPortal/LexCorp/etc lab).
  Generes automatiquement par KryptoniteSuite.
logsource:
    product: windows
    service: sysmon
detection:
    process_creation:
        Image|endswith:
          - '01_keylogger'
          - '02_reverse_shell'
          - '04_clipboard'
          - '05_usb_worm'
          - '07_screenspy'
          - '08_webcam'
          - '10_mic_rec'

    file_event:
        TargetFilename|contains:
          - 'sys.log'
          - 'clip.log'
          - 'portal.command'
          - 'rick_key.bin'
          - 'README_RICK.txt'

    persistence:
        'com.rick.keylog'
    condition: 1 of them
fields:
    - Image
    - TargetFilename
falsepositives:
    - machines de lab Maxime Leal (autorise)
level: high
tags:
    - attack.execution
    - attack.persistence
