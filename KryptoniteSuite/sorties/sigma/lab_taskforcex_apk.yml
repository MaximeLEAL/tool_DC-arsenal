title: TaskForceX APK — traces d'agent (kit lab Maxime Leal)
status: experimental
description: >
  Detection des traces du kit TaskForceX APK (RickPortal/LexCorp/etc lab).
  Generes automatiquement par KryptoniteSuite.
logsource:
    product: windows
    service: sysmon
detection:
    file_event:
        TargetFilename|contains:
          - 'lex.apk'
          - 'LexService.class'

    persistence:
        'com.lexcorp.lexservice (service Android, START_STICKY)'
    condition: 1 of them
fields:
    - Image
    - TargetFilename
falsepositives:
    - machines de lab Maxime Leal (autorise)
level: high
tags:
    - attack.execution
    - attack.persistence
